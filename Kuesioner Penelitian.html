<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cara Menyusun Kuesioner Penelitian yang Baik</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d17;--bg2:#171c36;--fg:#f3efe6;--mut:#8b8fa8;--line:#a9adc6;--gold:#e6c27a;--blue:#7aa7e6;--rose:#e68a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f6f1e7;--bg2:#e6dcc8;--fg:#1d1a26;--mut:#6c6a7c;--line:#4a4860;--gold:#b8862b;--blue:#3c6bb5;--rose:#c0504d;color-scheme:light}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--fg);background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%);overflow:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.o1{width:260px;height:260px;background:var(--gold);top:-80px;right:-80px;opacity:.18}
.o2{width:300px;height:300px;background:var(--blue);bottom:-120px;left:-100px;opacity:.16;animation-delay:-6s}
@keyframes drift{to{transform:translate(-40px,50px) scale(1.15)}}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;padding:18px 24px 22px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut)}
.top b{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:15px;letter-spacing:.05em;color:var(--gold)}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:14px 0 6px}
.brand{flex:0 0 auto;text-align:center;font:500 9px Inter,sans-serif;letter-spacing:.3em;color:var(--gold);opacity:.8;padding:16px 0 4px}
.stage{width:100%;aspect-ratio:4/3;display:flex;align-items:center;transition:opacity .4s,filter .4s,transform .4s}
.stage svg{width:100%;max-height:100%;overflow:visible}
.cap{min-height:170px;text-align:center;font-family:Fraunces,Georgia,serif;font-size:clamp(21px,5.6vw,29px);line-height:1.3;letter-spacing:-.01em;padding-top:6px;transition:opacity .35s,filter .35s}
.cap span{display:inline-block;opacity:0;animation:w .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(.2s + var(--i)*.1s);margin:0 .12em}
.cap em{font-style:italic;color:var(--gold)}
@keyframes w{from{opacity:0;filter:blur(10px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}
.out{opacity:0!important;filter:blur(8px)}
.stage.out{transform:scale(.97)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:14px}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:5px;height:5px;border-radius:5px;background:var(--mut);opacity:.4;transition:all .4s}
.dots i.on{opacity:.9;background:var(--gold)}
.dots i.cur{width:22px;opacity:1;background:var(--gold)}
button{font:inherit;cursor:pointer;border:0;color:inherit;transition:transform .2s,opacity .2s}
button:active{transform:scale(.96)}
#prev{background:none;font-size:13px;color:var(--mut);padding:10px 4px;letter-spacing:.1em}
#prev:disabled{opacity:0}
#next{display:flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#14110a;background:linear-gradient(135deg,var(--gold),#f6e2b0);box-shadow:0 10px 30px -8px var(--gold);animation:glw 2.6s ease-in-out infinite}
#next svg{width:16px;height:16px;stroke:#14110a;stroke-width:2;fill:none}
@keyframes glw{50%{box-shadow:0 14px 40px -4px var(--gold)}}
svg path,svg circle,svg line,svg rect{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg .g{stroke:var(--gold)}svg .b{stroke:var(--blue)}svg .r{stroke:var(--rose)}
svg .f{fill:var(--gold);stroke:none}svg .fb{fill:var(--blue);stroke:none}
svg text{fill:var(--mut);stroke:none;font:500 11px Inter,sans-serif;letter-spacing:.22em;text-anchor:middle}
svg text.s{font:italic 400 64px Fraunces,Georgia,serif;fill:var(--rose);letter-spacing:0}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.5s var(--d,0s) cubic-bezier(.5,0,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.fi{opacity:0;animation:fi .9s var(--d,0s) forwards}
@keyframes fi{to{opacity:1}}
.tb{transform-box:fill-box;transform-origin:center}
.fl{animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.pl{animation:pl 2.6s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.12)}}
.dp{animation:dp 1.3s linear infinite;animation-delay:var(--d,0s)}@keyframes dp{from{transform:translateY(-6px);opacity:0}25%{opacity:1}to{transform:translateY(70px);opacity:0}}
.tw{animation:tw 2.4s var(--d,0s) ease-in-out infinite}@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.sp{animation:sp 14s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.cv{animation:cv 1.6s var(--d,0s) cubic-bezier(.2,.8,.2,1) both}@keyframes cv{from{transform:scale(2.2);opacity:0}}
.gl{filter:drop-shadow(0 0 10px var(--gold))}
.trio{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 8px;width:100%}
.trio figure{flex:0 1 clamp(70px,21vw,92px);min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:fi .8s var(--d,0s) forwards}
.trio .ph{width:100%;aspect-ratio:1;overflow:hidden;border-radius:50%;background:#fff;box-shadow:0 12px 30px #0005}
.trio .ph img{display:block;width:154%;max-width:none;margin:-7.75% 0 0 -27%}
.trio .walk img{margin:-13.1% 0 0 -25.1%}
.trio .bulb{background:#3d3fa8}
.trio .bulb img{width:129%;margin:-15.7% 0 0 -14.5%}
.trio .idea{position:relative}
.trio .idea .ph{box-shadow:0 0 30px -4px var(--gold)}
.trio .big{flex:0 0 100%;text-align:center;margin-top:18px;line-height:1;font:italic 400 clamp(60px,18vw,92px)/1 Fraunces,Georgia,serif;color:var(--gold);text-shadow:0 0 28px var(--gold);opacity:0;animation:pop2 .7s 1.6s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes pop2{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.trio figcaption{font:500 9px Inter,sans-serif;letter-spacing:.16em;color:var(--mut);text-align:center}
.trio .op{font:italic 24px Fraunces,serif;color:var(--mut)}
.trio .ar{flex:0 0 24px;width:24px;height:24px}
.stage:has(.duo){aspect-ratio:auto}
.duo{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.duo svg{width:100%;height:auto;max-height:27vh;flex:0 0 auto}
.duo .pat{flex:0 0 auto;margin:0;display:flex;flex-direction:row;align-items:center;gap:16px;opacity:0;animation:fi .8s .3s forwards}
.duo .ring{position:relative;flex:0 0 auto;width:clamp(96px,17vh,130px);aspect-ratio:1;border-radius:50%;padding:3px;background:conic-gradient(var(--gold),var(--blue),var(--gold));box-shadow:0 0 28px -6px var(--gold);animation:fl 4s ease-in-out infinite}
.duo .ring::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--gold);animation:rp2 3s ease-out infinite}
@keyframes rp2{from{transform:scale(.92);opacity:.5}to{transform:scale(1.3);opacity:0}}
.duo .ring img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 35%;border:2px solid var(--bg)}
.duo .pat figcaption{font:500 12px Inter,sans-serif;letter-spacing:.2em;line-height:1.7;color:var(--gold);max-width:100px;border-left:2px solid var(--gold);padding-left:12px;text-align:left}
.flow{stroke-dasharray:2 10;stroke-width:3;animation:fw 1s linear infinite,fi .9s var(--d,0s) forwards}@keyframes fw{to{stroke-dashoffset:-24}}
.glb{filter:drop-shadow(0 0 8px var(--blue))}
.hl{opacity:.05;animation:hl 2.4s var(--d,0s) ease-in-out infinite}@keyframes hl{50%{opacity:.25}}
.mv{offset-rotate:0deg;opacity:0;animation:mv 2.4s var(--d,0s) linear infinite}@keyframes mv{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
.stage:has(.fin){aspect-ratio:auto}
.brn{position:relative;width:min(100%,380px);aspect-ratio:889/635;overflow:hidden;margin:0 auto;opacity:0;animation:fi .8s .1s forwards}
.brn img{position:absolute;display:block;max-width:none;width:121.4848%;left:-10.7987%;top:-64.5669%}
.stage:has(.brn){aspect-ratio:auto}

.fin{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.lring{width:clamp(110px,22vh,150px);aspect-ratio:1;border-radius:50%;padding:3px;background:conic-gradient(var(--gold),var(--blue),var(--gold));box-shadow:0 0 40px -6px var(--gold);position:relative;animation:fl 4s ease-in-out infinite}
.lring::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid var(--gold);animation:rp2 3s ease-out infinite}
.lring img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;font:500 12px Inter,sans-serif;letter-spacing:.06em;color:var(--fg);border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);opacity:0;animation:fi .6s var(--d,0s) forwards}
.chip svg{width:17px;height:17px;flex:0 0 17px}
.chip svg path,.chip svg rect,.chip svg circle{stroke:var(--gold);stroke-width:1.8}
.chip svg .f{fill:var(--gold)}
.hdl{font:500 11px Inter,sans-serif;letter-spacing:.3em;color:var(--gold);opacity:0;animation:fi .8s 1.2s forwards}
.cover{width:min(100%,400px);margin:0 auto;aspect-ratio:500/281;overflow:hidden;border-radius:16px;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);box-shadow:0 14px 34px #0005;opacity:0;animation:fi .9s .2s forwards}
.cover img{display:block;width:100%;height:100%;object-fit:cover}
.shk{animation:shk .35s ease-in-out infinite alternate}@keyframes shk{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.st{opacity:0;animation:st 2.4s var(--d,0s) ease-in-out infinite;fill:none}@keyframes st{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
.ev{animation:ev 3.2s var(--d,0s) ease-in infinite}@keyframes ev{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}
.fr{fill:var(--rose);stroke:none}
.rej{opacity:0;animation:rej 2.6s var(--d,0s) ease-in infinite}@keyframes rej{0%{opacity:0;transform:translate(-30px,-6px)}20%{opacity:1;transform:none}55%{opacity:1;transform:translate(6px,0)}100%{opacity:0;transform:translate(46px,-40px) rotate(25deg)}}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot{gap:8px}.dots{gap:3px;min-width:0}.dots i{width:3px;height:3px;flex:0 0 3px}.dots i.cur{width:13px;flex:0 0 13px}

/* Round, icon-only navigation buttons. */
.foot #prev,.foot #next{width:48px;height:48px;min-width:48px;min-height:48px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 48px;line-height:1;letter-spacing:0;font-size:24px;text-transform:none;box-sizing:border-box}
.foot #prev,.foot #next{background:linear-gradient(135deg,var(--gold),#f6e2b0);border:1px solid rgba(255,255,255,.22);color:#14110a;box-shadow:0 5px 16px rgba(0,0,0,.18);animation:none;transition:transform .2s ease,box-shadow .2s ease,opacity .2s ease}
.foot #prev:not(:disabled):hover,.foot #next:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.25)}
.foot #prev:disabled{opacity:.25;cursor:not-allowed}
.foot #prev svg,.foot #next svg{width:21px;height:21px;display:block;stroke:#14110a;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.foot #next svg{width:21px;height:21px;display:block}
.foot #prev:focus-visible,.foot #next:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
@media(max-width:420px){.foot #prev,.foot #next{width:42px;height:42px;min-width:42px;min-height:42px;flex-basis:42px}}
/* Responsive layout: prevents visual, caption and navigation collisions on laptops. */
html,body{min-height:100%;height:auto}
body{overflow-x:hidden;overflow-y:auto}
.app{min-height:100dvh;height:auto;max-width:720px;gap:0}
.mid{flex:1 0 auto;min-height:0;padding:14px 0 8px}
.stage{height:auto;max-height:48dvh;min-height:0;justify-content:center;overflow:visible}
.stage svg{max-height:48dvh;display:block}
.cap{min-height:0;padding:12px 8px 18px;overflow-wrap:anywhere}
.foot{flex-shrink:0;padding-bottom:8px}
.dots{flex-wrap:wrap;justify-content:center}
.stage:has(.duo),.stage:has(.fin),.stage:has(.brn){max-height:none}
.duo svg{max-height:27dvh}
.brn{max-height:43dvh;width:auto;max-width:100%}
.cover{max-height:42dvh}
@media (min-width:900px){
  .app{max-width:1080px;padding:20px 44px 24px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:52px;row-gap:12px;align-items:center}
  .top{grid-column:1/-1;align-self:start}
  .brand{grid-column:1/-1;grid-row:1;justify-self:center;align-self:end;padding:0}
  .mid{grid-column:1;grid-row:2;display:flex;align-items:center;justify-content:center;padding:8px 0;min-width:0;min-height:0}
  .stage{width:100%;max-height:min(68dvh,620px);aspect-ratio:auto;min-height:0}
  .stage svg{max-height:min(68dvh,620px);width:100%;height:auto}
  .cap{grid-column:2;grid-row:2;text-align:left;font-size:clamp(24px,2.8vw,39px);line-height:1.35;padding:16px 0;min-height:0}
  .foot{grid-column:1/-1;grid-row:3;width:100%;padding:12px 0 0;gap:16px}
  .dots{gap:5px}
  .dots i{width:5px;height:5px;flex-basis:5px}
  .dots i.cur{width:20px;flex-basis:20px}
  .stage:has(.duo),.stage:has(.fin),.stage:has(.brn){max-height:min(68dvh,620px)}
  .duo svg{max-height:37dvh}
  .duo{gap:8px}
  .brn{max-height:60dvh}
  .cover{max-height:50dvh}
}
@media (max-height:650px) and (min-width:900px){
  .app{min-height:100dvh;row-gap:4px;padding-top:10px;padding-bottom:10px}
  .stage,.stage:has(.duo),.stage:has(.fin),.stage:has(.brn){max-height:58dvh}
  .stage svg{max-height:58dvh}
  .duo svg{max-height:28dvh}
  .cap{font-size:clamp(21px,2.3vw,31px)}
  .brn{max-height:52dvh}
}
@media (max-width:899px){
  .stage{max-height:44dvh}
  .stage svg{max-height:44dvh}
}
@media (max-height:560px) and (max-width:899px){
  .stage,.stage svg{max-height:38dvh}
  .cap{font-size:clamp(19px,4vw,26px)}
}
</style>

const T=[
['Judul','Cara Menyusun Kuesioner Penelitian yang Baik 📋',['Menyusun','Kuesioner','Baik']],
['Pembuka','Pernah salin kuesioner dari skripsi lama, ubah sedikit, lalu langsung masukkan ke Google Forms? Atau semua indikator belum terwakili?',['salin','Google','Forms?','terwakili?']],
['Intinya','Kuesioner yang baik bukan sekadar kumpulan pernyataan. Ia instrumen yang sistematis, berdasar teori, dan sesuai responden.',['instrumen','sistematis,','teori,']],
['Peta langkah','Ada 12 langkah penting. Kita bahas satu per satu, dari teori sampai pemeriksaan akhir.',['12','langkah']],
['Langkah 1','Tentukan variabel dan landasan teorinya. Jangan membuat pernyataan dari asumsi pribadi.',['variabel','teorinya.','asumsi','pribadi.']],
['Langkah 2','Jabarkan variabel menjadi dimensi (jika ada) dan indikator. Tidak semua variabel perlu dimensi, tergantung teorinya.',['dimensi','indikator.']],
['Langkah 2','Setiap indikator harus punya butir pernyataan. Jangan ada indikator yang hilang, dan jangan ada pernyataan tanpa indikator.',['setiap','indikator','butir']],
['Langkah 3','Buat kisi-kisi dulu: peta yang menghubungkan teori dengan butir pernyataan, berisi variabel, indikator, nomor butir, dan rancangan pernyataan.',['kisi-kisi','peta']],
['Langkah 3','Pernyataan harus mencerminkan indikator secara konkret, bukan klaim umum tentang diri responden.',['konkret,','indikator']],
['Langkah 4','Susun pernyataan dengan bahasa sederhana, hindari istilah teknis, satu gagasan, dan tidak menggiring jawaban.',['sederhana,','satu','menggiring']],
['Langkah 4','Pernyataan yang menggabungkan dua aspek sebaiknya dipecah menjadi dua pernyataan terpisah.',['dua','terpisah.']],
['Langkah 4','Pilih skala jawaban sesuai tujuan. Likert sering dipakai untuk sikap dan persepsi, tetapi tidak wajib untuk semua pertanyaan.',['Likert','tidak','wajib']],
['Langkah 5','Sudah selesai disusun, apakah siap disebar? Belum tentu. Minta ahli menilai isinya dulu (expert judgment).',['Belum','tentu.','ahli']],
['Langkah 5','Ahli memeriksa kesesuaian dengan indikator, bahasa, relevansi isi, dan keterwakilan aspek penting. Untuk skripsi S1, dua atau tiga ahli relevan dapat dilibatkan.',['ahli','keterwakilan']],
['Langkah 6','Awali Google Forms dengan identitas peneliti: nama, institusi, judul, tujuan, dan kontak. Responden berhak tahu siapa yang meminta datanya.',['identitas','peneliti:','berhak']],
['Langkah 7','Beri pengantar atau infografis singkat, tetapi harus netral dan tidak menggiring. Jelaskan secukupnya agar tidak menimbulkan bias.',['netral','menggiring.','bias.']],
['Langkah 8','Sertakan persetujuan responden (informed consent). Jangan menjanjikan anonimitas jika Google Forms mengumpulkan email.',['persetujuan','anonimitas']],
['Langkah 9','Tanyakan identitas responden hanya jika ada tujuannya. Data yang tidak dibutuhkan sebaiknya tidak diminta.',['tujuannya.','tidak','diminta.']],
['Langkah 10','Gunakan pertanyaan penyaring. Jika syarat penelitian tidak terpenuhi, pengisian dapat diakhiri lewat percabangan Google Forms.',['penyaring.','percabangan']],
['Langkah 10','Penyaringan harus berdasar kriteria inklusi dan eksklusi, bukan untuk memilih jawaban yang menguntungkan hipotesis.',['kriteria','inklusi','eksklusi,']],
['Langkah 11','Sajikan pernyataan secara sistematis dengan petunjuk jelas. Label jawaban harus sesuai jenis pernyataannya.',['sistematis','petunjuk','sesuai']],
['Langkah 11','Perhatikan panjang kuesioner. Terlalu panjang membuat responden lelah, kehilangan fokus, atau menjawab terburu-buru.',['panjang','lelah,']],
['Langkah 12','Periksa seluruh alur. Coba isi dari awal sampai akhir seperti responden, dan minta beberapa orang serupa responden mencoba.',['alur.','awal','akhir']],
['Rangkuman','Dari teori, indikator, kisi-kisi, pernyataan, validasi ahli, sampai etika, semuanya harus disusun sistematis.',['teori,','sistematis.']],
['Penutup','Kuesioner yang selesai dibuat belum tentu siap dipakai. Masih ada uji coba dan evaluasi kualitas. Bagaimana caranya? Nantikan materi berikutnya!',['belum','tentu','siap','berikutnya!']],
['Ikuti kami','Yuk, follow dan subscribe mathnology!',['follow','subscribe','mathnology!']]
];
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
let i=0,busy=0;
$('dots').innerHTML=T.map(()=>'<i></i>').join('');
const arrow='<svg viewBox="0 0 16 16"><path d="M2 8h12M9 3l5 5-5 5"/></svg>';
function render(){
  $('stage').innerHTML=V[i]();
  $('tag').textContent=T[i][0];$('cnt').textContent=pad(i+1)+' / '+pad(T.length);
  $('cap').innerHTML=T[i][1].split(' ').map((w,k)=>{const h=T[i][2].includes(w);return`<span style="--i:${k}">${h?'<em>'+w+'</em>':w}</span>`}).join(' ');
  [...$('dots').children].forEach((d,k)=>d.className=k<i?'on':k==i?'cur':'');
  $('prev').disabled=!i;
  $('next').innerHTML=i==T.length-1?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.5 9a7 7 0 0 1 12-2L20 12M4 12l2.5 5a7 7 0 0 0 12-2"/></svg>':arrow;
  $('next').setAttribute('aria-label',i==T.length-1?'Ulangi materi':'Materi berikutnya');
  $('next').title=i==T.length-1?'Ulangi materi':'Materi berikutnya';
  $('stage').classList.remove('out');$('cap').classList.remove('out');busy=0;
}
function go(n){if(busy)return;busy=1;$('stage').classList.add('out');$('cap').classList.add('out');setTimeout(()=>{i=n;render()},380)}
$('next').onclick=()=>go(i==T.length-1?0:i+1);
$('prev').onclick=()=>i&&go(i-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
render();
</script>
